spring.application.name=doctorAppointmentSystem

application.db.url = ${URl: jdbc:mysql://localhost:3306/}
application.db.username = ${DB_USERNAME:postgres}
application.db.password = ${DB_PASSWORD:postgres}

application.jwt.key=${JWT_KEY:changeme-generate-a-long-random-string-for-real-use}
application.jwt.expiry=3600000

server.port=${PORT:8080}